<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CipherVault · 密语保险箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080a0f; --bg-2:#0b0e15; --panel:#101521; --panel-2:#141a27; --panel-3:#182030;
  --line:#212a3a; --line-2:#2a3546;
  --txt:#e8edf7; --dim:#93a0b8; --mute:#5a6579;
  --accent:#4f8cff; --accent-2:#7db0ff; --cyan:#33d6c8;
  --good:#35d07f; --warn:#ffb020; --bad:#ff5f6d;
  --r:12px; --r-sm:9px;
  --shadow:0 30px 80px -40px rgba(0,0,0,.9);
  --font:"Manrope","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --disp:"Sora","Manrope","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);color:var(--txt);background:var(--bg);
  background-image:
    radial-gradient(1100px 620px at 82% -8%, rgba(79,140,255,.10), transparent 58%),
    radial-gradient(900px 560px at -6% 108%, rgba(51,214,200,.07), transparent 55%);
  -webkit-font-smoothing:antialiased;font-size:14px;
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit}
.hidden{display:none !important}
.mono{font-family:var(--mono)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#242e40;border-radius:9px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:#314059;background-clip:padding-box}
::selection{background:rgba(79,140,255,.32)}

/* ============ 锁屏 ============ */
#lock{min-height:100vh;display:grid;place-items:center;padding:28px}
.lockcard{
  width:min(420px,94vw);padding:38px 36px 30px;border-radius:18px;
  background:linear-gradient(180deg,#121826,#0c1018);border:1px solid var(--line);
  box-shadow:var(--shadow);position:relative;overflow:hidden;
  animation:rise .6s cubic-bezier(.2,.7,.2,1) both;
}
.lockcard::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(420px 220px at 50% -30%, rgba(79,140,255,.16), transparent 70%)}
.mark{
  width:52px;height:52px;border-radius:15px;display:grid;place-items:center;
  background:linear-gradient(150deg,#4f8cff,#2f66d6);box-shadow:0 12px 28px -12px rgba(79,140,255,.9);
  font-family:var(--disp);font-weight:700;font-size:22px;color:#fff;letter-spacing:-.02em;
}
.lockcard h1{font-family:var(--disp);font-weight:600;font-size:26px;margin:20px 0 6px;letter-spacing:-.02em}
.lockcard .tag{color:var(--dim);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 26px}
.finput{
  width:100%;padding:13px 15px;border-radius:var(--r-sm);background:#0a0e16;
  border:1px solid var(--line);color:var(--txt);font-size:14.5px;margin-bottom:11px;transition:.18s;
}
.finput:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.16);background:#0c1119}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 16px;border-radius:var(--r-sm);border:1px solid var(--line);
  color:var(--txt);font-size:13.5px;font-weight:500;transition:.16s;white-space:nowrap;
}
.btn:hover{border-color:var(--line-2);background:var(--panel-2)}
.btn.primary{background:linear-gradient(180deg,#5b97ff,#3d78e6);border-color:transparent;color:#fff;box-shadow:0 12px 26px -14px rgba(79,140,255,.95)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.block{width:100%}
.btn.ghost{border-color:transparent;color:var(--dim)}
.btn.ghost:hover{color:var(--txt);background:var(--panel-2)}
.btn.danger{color:var(--bad);border-color:rgba(255,95,109,.3)}
.btn.danger:hover{background:rgba(255,95,109,.1)}
.btn.tiny{padding:7px 11px;font-size:12.5px;border-radius:8px}
.msg{min-height:16px;font-size:12.5px;color:var(--bad);margin:12px 2px 0}
.msg.ok{color:var(--good)}
.foot-note{font-size:11.5px;color:var(--mute);line-height:1.9;margin:22px 0 0;padding-top:16px;border-top:1px solid var(--line)}

/* ============ 布局 ============ */
.app{display:grid;grid-template-columns:266px 1fr;height:100vh;overflow:hidden}
.sidebar{
  background:linear-gradient(180deg,#0c1018,#080a10);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:18px 14px;gap:14px;min-height:0;
}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px 2px}
.brand .mark{width:34px;height:34px;border-radius:10px;font-size:15px}
.brand .bt{display:flex;flex-direction:column;line-height:1.15}
.brand .bt b{font-family:var(--disp);font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand .bt span{font-size:10px;letter-spacing:.28em;color:var(--mute);text-transform:uppercase;margin-top:2px}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.5}
.search input{
  width:100%;padding:9px 12px 9px 34px;border-radius:var(--r-sm);background:#0a0e16;
  border:1px solid var(--line);color:var(--txt);font-size:13px;
}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.14)}
.nav{display:flex;flex-direction:column;gap:3px}
.navitem{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;font-size:13.5px;color:var(--dim);transition:.15s;
}
.navitem:hover{background:var(--panel-2);color:var(--txt)}
.navitem.on{background:linear-gradient(90deg,rgba(79,140,255,.18),rgba(79,140,255,.05));color:#fff;box-shadow:inset 2px 0 0 var(--accent)}
.navitem .ic{width:17px;text-align:center;opacity:.8}
.navitem .cnt{margin-left:auto;font-size:11px;color:var(--mute);font-family:var(--mono)}
.sidehead{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);padding:10px 11px 4px;display:flex;justify-content:space-between;align-items:center}
.sidehead button{color:var(--mute);font-size:15px;line-height:1}
.sidehead button:hover{color:var(--accent)}
.cats{display:flex;flex-direction:column;gap:3px;overflow:auto;min-height:0}
.sidefoot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:linear-gradient(180deg,#0a0d14,#080a10)}
.toolbar{
  display:flex;align-items:center;gap:12px;padding:16px 26px;border-bottom:1px solid var(--line);
}
.toolbar h2{font-family:var(--disp);font-weight:600;font-size:19px;margin:0;letter-spacing:-.01em}
.toolbar .sub{color:var(--mute);font-size:12px;margin-left:2px}
.toolbar .spacer{flex:1}
.select{
  padding:8px 11px;border-radius:8px;background:#0a0e16;border:1px solid var(--line);color:var(--dim);font-size:12.5px;
}
.select:focus{outline:none;border-color:var(--accent)}
.list{padding:20px 26px;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px;align-content:start}
.card{
  text-align:left;padding:16px 16px 14px;border-radius:var(--r);border:1px solid var(--line);
  background:linear-gradient(180deg,#111726,#0d121c);transition:.18s;display:flex;flex-direction:column;gap:12px;
  animation:rise .5s cubic-bezier(.2,.7,.2,1) both;
}
.card:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:0 22px 44px -30px rgba(0,0,0,.9)}
.card .ch{display:flex;align-items:center;gap:11px}
.avatar{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-family:var(--disp);
  font-weight:600;font-size:16px;color:#fff;flex:none;
}
.card .cn{font-weight:600;font-size:14.5px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .ca{font-size:12px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.card .cf{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mute)}
.chipcat{padding:3px 9px;border-radius:99px;background:rgba(79,140,255,.12);color:var(--accent-2);font-size:10.5px;letter-spacing:.04em}
.chipcat.gray{background:var(--panel-3);color:var(--dim)}
.star{cursor:pointer;font-size:14px;line-height:1;opacity:.35;transition:.15s}
.star.on{opacity:1;color:var(--warn)}
.star:hover{opacity:.9}
.card .strength{height:4px;border-radius:4px;background:var(--panel-3);overflow:hidden}
.card .strength i{display:block;height:100%;border-radius:4px;transition:width .3s}

.empty{
  grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:14px;
}
.empty .ebadge{width:64px;height:64px;border-radius:20px;background:var(--panel-2);display:grid;place-items:center;font-size:26px;border:1px solid var(--line)}
.empty h3{font-family:var(--disp);font-weight:600;color:var(--txt);margin:0;font-size:17px}
.empty p{margin:0;font-size:13px;line-height:1.9;max-width:320px}

/* ============ 抽屉详情 ============ */
.backdrop{position:fixed;inset:0;background:rgba(4,6,10,.6);backdrop-filter:blur(2px);z-index:30;opacity:0;pointer-events:none;transition:.25s}
.backdrop.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;top:0;right:0;height:100vh;width:min(470px,96vw);z-index:31;
  background:linear-gradient(180deg,#111726,#0c1017);border-left:1px solid var(--line);
  transform:translateX(102%);transition:transform .3s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column;box-shadow:var(--shadow);
}
.drawer.on{transform:none}
.dhead{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.dhead .dh-t{font-family:var(--disp);font-weight:600;font-size:16px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:4px;padding:12px 22px 0}
.tab{padding:8px 13px;border-radius:8px;font-size:12.5px;color:var(--dim);transition:.15s}
.tab:hover{color:var(--txt);background:var(--panel-2)}
.tab.on{background:var(--panel-2);color:#fff;box-shadow:inset 0 -2px 0 var(--accent)}
.dbody{padding:20px 22px 30px;overflow:auto;flex:1}
.field{margin-bottom:15px}
.field label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:7px}
.field .finput{margin-bottom:0}
.field .withbtn{display:flex;gap:8px}
.field .withbtn .finput{flex:1}
.field .withbtn .btn{flex:none}
textarea.finput{min-height:70px;resize:vertical;line-height:1.7}
.pwrow{display:flex;gap:8px}
.pwrow .finput{margin-bottom:0;font-family:var(--mono);letter-spacing:.04em}
.eyebtn{flex:none;width:44px;border-radius:var(--r-sm);border:1px solid var(--line);display:grid;place-items:center;color:var(--dim)}
.eyebtn:hover{color:var(--txt);border-color:var(--line-2)}
.meter{margin-top:9px}
.meter .bar{height:5px;border-radius:5px;background:var(--panel-3);overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:5px;width:0;transition:width .3s,background .3s}
.meter .lbl{font-size:11.5px;margin-top:6px;color:var(--dim);display:flex;justify-content:space-between}
.genbox{border:1px solid var(--line);border-radius:var(--r);padding:15px;background:var(--panel);margin:6px 0 16px}
.genbox .gh{font-size:12px;color:var(--dim);letter-spacing:.06em;margin-bottom:12px;display:flex;justify-content:space-between}
.genbox input[type=range]{width:100%;accent-color:var(--accent)}
.genopts{display:flex;gap:14px;flex-wrap:wrap;margin:12px 0}
.genopts label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);cursor:pointer}
.genopts input{accent-color:var(--accent)}

.cryptocard{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:16px;margin-bottom:14px}
.cryptocard .ch2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-bottom:10px;display:flex;justify-content:space-between}
.cipher{font-family:var(--mono);font-size:14px;line-height:2;word-break:break-all;color:#cfe0ff}
.cipher .sep{color:var(--accent)}
.selfcheck{font-size:11.5px;font-family:var(--mono);margin-top:10px}
.skinpick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.skinpick .chip{padding:7px 13px;border-radius:99px;border:1px solid var(--line);font-size:12px;color:var(--dim);transition:.15s}
.skinpick .chip:hover{border-color:var(--line-2);color:var(--txt)}
.skinpick .chip.on{background:linear-gradient(180deg,#5b97ff,#3d78e6);border-color:transparent;color:#fff}
.rule{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.rule .no{font-family:var(--mono);font-size:11px;color:var(--mute);width:24px}
.rule select{flex:1;padding:7px 9px;border-radius:8px;background:#0a0e16;border:1px solid var(--line);color:var(--txt);font-size:12.5px}
.dfoot{display:flex;gap:10px;padding:16px 22px;border-top:1px solid var(--line);background:#0a0d14}
.dfoot .btn{flex:1}

/* ============ 设置 / 模态 ============ */
.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(4,6,10,.66);backdrop-filter:blur(3px);padding:20px}
.modal .mbox{width:min(520px,94vw);border:1px solid var(--line);border-radius:16px;background:linear-gradient(180deg,#121826,#0c1018);box-shadow:var(--shadow);padding:26px 28px}
.modal h2{font-family:var(--disp);font-weight:600;font-size:19px;margin:0 0 20px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--line)}
.setrow .sl{font-size:13.5px}
.setrow .sd{font-size:11.5px;color:var(--mute);margin-top:3px}
.modal .mfoot{display:flex;gap:10px;margin-top:22px}
.modal .mfoot .btn{flex:1}

/* ============ Toast ============ */
#toasts{position:fixed;top:18px;right:18px;z-index:60;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{
  padding:12px 16px;border-radius:11px;background:#121826;border:1px solid var(--line);box-shadow:var(--shadow);
  font-size:13px;display:flex;align-items:center;gap:10px;animation:slidein .28s cubic-bezier(.2,.8,.3,1) both;max-width:360px;
}
.toast .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.toast.ok .dot{background:var(--good)} .toast.err .dot{background:var(--bad)} .toast.warn .dot{background:var(--warn)}
.toast.out{animation:slideout .25s ease forwards}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
@keyframes slideout{to{opacity:0;transform:translateX(16px)}}

@media(max-width:760px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
}
</style>
</head>
<body>

<!-- ============ 锁屏 ============ -->
<div id="lock">
  <div class="lockcard">
    <div class="mark">CV</div>
    <h1>密语保险箱</h1>
    <p class="tag">CipherVault · Local Password Vault</p>

    <div id="lockCreate" class="hidden">
      <input id="pwNew" class="finput" type="password" placeholder="设置主密码（至少 8 位）" autocomplete="new-password">
      <input id="pwNew2" class="finput" type="password" placeholder="确认主密码" autocomplete="new-password">
      <button id="btnCreate" class="btn primary block">创建保险箱</button>
    </div>

    <div id="lockUnlock" class="hidden">
      <input id="pwInput" class="finput" type="password" placeholder="输入主密码解锁" autocomplete="current-password">
      <button id="btnUnlock" class="btn primary block">解锁</button>
      <button id="btnReset" class="btn ghost block tiny" style="margin-top:10px">重置本地保险箱</button>
    </div>

    <p id="lockMsg" class="msg"></p>
    <p class="foot-note">
      数据仅存于本机：主密码经 <b>PBKDF2</b> 派生密钥，保险箱由 <b>AES-GCM</b> 加密。<br>
      不联网、不上传、无后门；忘记主密码将无法找回。
    </p>
  </div>
</div>

<!-- ============ 主应用 ============ -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">CV</div>
      <div class="bt"><b>密语保险箱</b><span>CipherVault</span></div>
    </div>

    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#5a6579" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="搜索名称 / 账号 / 分类…">
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidehead">分类 <button id="btnAddCat" title="新建分类">＋</button></div>
    <div class="cats" id="cats"></div>

    <div class="sidefoot">
      <button id="btnNew" class="btn primary block">＋ 新建密码</button>
      <div style="display:flex;gap:8px">
        <button id="btnSettings" class="btn" style="flex:1">设置</button>
        <button id="btnLock" class="btn" style="flex:1">锁定</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <h2 id="listTitle">全部条目</h2>
      <span class="sub" id="listSub"></span>
      <span class="spacer"></span>
      <select id="sort" class="select">
        <option value="recent">最近修改</option>
        <option value="name">按名称</option>
        <option value="fav">收藏优先</option>
      </select>
    </div>
    <div class="list" id="list"></div>
  </main>
</div>

<!-- 抽屉 -->
<div class="backdrop" id="backdrop"></div>
<div class="drawer" id="drawer"></div>

<!-- 设置 -->
<div id="settings" class="modal hidden">
  <div class="mbox">
    <h2>设置</h2>
    <div class="setrow">
      <div><div class="sl">密钥派生强度（PBKDF2 迭代）</div><div class="sd">越高越安全，修改需重新输入主密码</div></div>
      <select id="setIters" class="select">
        <option value="100000">10 万</option>
        <option value="200000">20 万</option>
        <option value="500000">50 万</option>
      </select>
    </div>
    <div class="setrow">
      <div><div class="sl">自动锁定（无操作后）</div><div class="sd">超过该时长未操作将自动锁定</div></div>
      <select id="setAuto" class="select">
        <option value="1">1 分钟</option><option value="5">5 分钟</option>
        <option value="15">15 分钟</option><option value="60">60 分钟</option>
        <option value="0">从不</option>
      </select>
    </div>
    <div class="setrow">
      <div><div class="sl">复制后清空剪贴板</div><div class="sd">防止密码长期残留在剪贴板</div></div>
      <select id="setClip" class="select">
        <option value="10">10 秒</option><option value="30">30 秒</option>
        <option value="60">60 秒</option><option value="0">不清空</option>
      </select>
    </div>
    <div class="setrow" style="border-bottom:0">
      <div><div class="sl">保险箱备份</div><div class="sd">导出 / 导入加密后的保险箱文件</div></div>
      <div style="display:flex;gap:8px">
        <button id="btnExport" class="btn tiny">导出</button>
        <button id="btnImport" class="btn tiny">导入</button>
        <input id="importFile" type="file" accept=".json" class="hidden">
      </div>
    </div>
    <div class="mfoot">
      <button id="setClose" class="btn">关闭</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script>
/* ============================================================
   CipherVault MVP v2
   安全层：PBKDF2 派生密钥 + AES-GCM 整库加密（Web Crypto）
   趣味层：皮肤（字母/古诗/数字）只编码“密文”，与安全层解耦
   钥匙卡：可导出、零依赖、脱离本项目独立还原
   ============================================================ */
const enc = new TextEncoder(), dec = new TextDecoder();
const bytesToB64 = b => { let s=''; b.forEach(x=>s+=String.fromCharCode(x)); return btoa(s); };
const b64ToBytes = s => { const t=atob(s), a=new Uint8Array(t.length); for(let i=0;i<t.length;i++)a[i]=t.charCodeAt(i); return a; };
const bytesToHex = b => { let s=''; b.forEach(x=>s+=x.toString(16).padStart(2,'0')); return s; };
const hexToBytes = h => { const a=new Uint8Array(h.length/2); for(let i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16); return a; };
const uuid = () => 'e'+Math.random().toString(16).slice(2,10)+Date.now().toString(16).slice(-6);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 安全层 ---------- */
async function deriveKey(password, saltB64, iters){
  const k = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64ToBytes(saltB64), iterations:iters, hash:'SHA-256' },
    k, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function encBytes(key, bytes){ const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes); return { iv:bytesToB64(iv), ct:bytesToB64(new Uint8Array(ct)) }; }
async function decBytes(key, ivB64, ctB64){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(ivB64)},key,b64ToBytes(ctB64)); return new Uint8Array(pt); }

/* ---------- 趣味层：皮肤 ---------- */
const POEMS=['床前明月光','疑是地上霜','举头望明月','低头思故乡','春眠不觉晓','处处闻啼鸟','夜来风雨声','花落知多少',
  '白日依山尽','黄河入海流','欲穷千里目','更上一层楼','锄禾日当午','汗滴禾下土','谁知盘中餐','粒粒皆辛苦'];
const SEP='·';
const XF={
  letter:{label:'英文字母',encode:n=>String.fromCharCode(65+n),decode:s=>{const v=s.charCodeAt(0)-65;return(v>=0&&v<16)?v:-1;}},
  number:{label:'数字',encode:n=>String(n+10),decode:s=>{const v=parseInt(s,10)-10;return(v>=0&&v<16)?v:-1;}},
  poem:{label:'古诗',encode:n=>POEMS[n],decode:s=>POEMS.indexOf(s)}
};
const SKINS={letter:{name:'字母皮肤',rules:['letter']},poem:{name:'古诗皮肤',rules:['poem']},
  number:{name:'数字皮肤',rules:['number']},mixed:{name:'混合皮肤',rules:['letter','poem','number']}};
const encodeToken=(hex,rules)=>{let o=[];for(let i=0;i<hex.length;i++)o.push(XF[rules[i%rules.length]].encode(parseInt(hex[i],16)));return o.join(SEP);};
const decodeToken=(disp,rules)=>{const segs=disp.split(SEP);let hex='';for(let i=0;i<segs.length;i++){const v=XF[rules[i%rules.length]].decode(segs[i]);if(v<0)throw new Error('第 '+(i+1)+' 段无法还原');hex+=v.toString(16);}return hex;};

/* ---------- 密码强度 ---------- */
function strengthScore(pw){
  if(!pw) return 0; let v=0;
  if(pw.length>=8)v++; if(pw.length>=12)v++; if(pw.length>=16)v++;
  const cls=[/[a-z]/,/[A-Z]/,/[0-9]/,/[^A-Za-z0-9]/].filter(r=>r.test(pw)).length;
  v+=Math.min(2,Math.max(0,cls-1));
  return Math.min(4,v);
}
const SLEVEL=[{t:'无',c:'#5a6579'},{t:'弱',c:'#ff5f6d'},{t:'一般',c:'#ffb020'},{t:'较强',c:'#33d6c8'},{t:'强',c:'#35d07f'}];
function strengthHTML(pw){
  const s=strengthScore(pw), L=SLEVEL[s];
  return '<div class="meter"><div class="bar"><i style="width:'+(s*25)+'%;background:'+L.c+'"></i></div>'+
    '<div class="lbl"><span id="meterLbl">强度：'+L.t+'</span><span class="mono">'+pw.length+' 字符</span></div></div>';
}

/* ---------- 密码生成器 ---------- */
function genPassword(len, o){
  let pools=''; if(o.lower)pools+='abcdefghijkmnopqrstuvwxyz'; if(o.upper)pools+='ABCDEFGHJKLMNPQRSTUVWXYZ';
  if(o.digit)pools+='23456789'; if(o.sym)pools+='!@#$%^&*-_=+?';
  if(!pools) pools='abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const rnd=new Uint32Array(len); crypto.getRandomValues(rnd);
  let out=''; for(let i=0;i<len;i++) out+=pools[rnd[i]%pools.length];
  return out;
}

/* ---------- 状态 ---------- */
const STORE='cv_store';
let KEY=null, SALT=null, ITERS=200000, VAULT=null, SEL=null, NAV={type:'all',cat:null}, Q='', SORT='recent', lastAct=Date.now();

const AV_COLORS=['#4f8cff','#33d6c8','#8b7bff','#ff7a9c','#ffb020','#35d07f','#ff8a5b','#5ab0ff'];
const hashColor = s => AV_COLORS[Math.abs([...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0))%AV_COLORS.length];
const readStore = () => { try{return JSON.parse(localStorage.getItem(STORE)||'null');}catch(e){return null;} };
async function saveVault(){
  const {iv,ct} = await encBytes(KEY, enc.encode(JSON.stringify(VAULT)));
  localStorage.setItem(STORE, JSON.stringify({v:'cv1', salt:SALT, iters:ITERS, iv, ct}));
}

/* ---------- Toast ---------- */
function toast(msg, kind){
  const el=document.createElement('div'); el.className='toast '+(kind||'');
  el.innerHTML='<span class="dot"></span><span>'+esc(msg)+'</span>';
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>el.remove(),250); },2600);
}

/* ---------- 锁屏 ---------- */
function boot(){
  const st=readStore();
  document.getElementById('lockMsg').textContent='';
  document.getElementById('lockCreate').classList.toggle('hidden', !!st);
  document.getElementById('lockUnlock').classList.toggle('hidden', !st);
}
const setMsg=(t,ok)=>{const e=document.getElementById('lockMsg');e.textContent=t;e.className='msg'+(ok?' ok':'');};
async function doCreate(){
  const a=document.getElementById('pwNew').value, b=document.getElementById('pwNew2').value;
  if(a.length<8){setMsg('主密码至少 8 位');return;}
  if(a!==b){setMsg('两次输入不一致');return;}
  SALT=bytesToB64(crypto.getRandomValues(new Uint8Array(16))); ITERS=200000;
  KEY=await deriveKey(a,SALT,ITERS);
  VAULT={entries:[],categories:[],settings:{autoLockMin:5,clipboardClearSec:30}};
  await saveVault(); enterApp();
}
async function doUnlock(){
  const pw=document.getElementById('pwInput').value, st=readStore(); if(!st)return;
  try{
    KEY=await deriveKey(pw,st.salt,st.iters); SALT=st.salt; ITERS=st.iters;
    VAULT=JSON.parse(dec.decode(await decBytes(KEY,st.iv,st.ct)));
    VAULT.categories=VAULT.categories||[]; VAULT.settings=VAULT.settings||{autoLockMin:5,clipboardClearSec:30};
    enterApp();
  }catch(e){ setMsg('主密码错误，或本地数据损坏'); }
}
function enterApp(){
  document.getElementById('lock').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  NAV={type:'all',cat:null}; Q=''; SEL=null; lastAct=Date.now();
  document.getElementById('q').value='';
  renderNav(); renderList(); closeDrawer();
}
function doLock(){
  KEY=null; VAULT=null; SEL=null; closeDrawer();
  document.getElementById('app').classList.add('hidden');
  document.getElementById('lock').classList.remove('hidden');
  document.getElementById('pwInput').value=''; boot();
}

/* ---------- 列表 ---------- */
function visibleEntries(){
  let arr=VAULT.entries.slice();
  if(NAV.type==='fav') arr=arr.filter(e=>e.fav);
  if(NAV.type==='cat') arr=arr.filter(e=>e.category===NAV.cat);
  if(Q){ const q=Q.toLowerCase(); arr=arr.filter(e=>(e.name+' '+(e.account||'')+' '+(e.category||'')).toLowerCase().includes(q)); }
  if(SORT==='name') arr.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  else if(SORT==='fav') arr.sort((a,b)=>(b.fav-a.fav)||(b.ts-a.ts));
  else arr.sort((a,b)=>b.ts-a.ts);
  return arr;
}

  const arr=visibleEntries();
  document.getElementById('listTitle').textContent = NAV.type==='fav'?'收藏':NAV.type==='cat'?NAV.cat:'全部条目';

async function makeCipher(e){
  const out=document.getElementById('cipherOut'); if(!out) return;
  out.textContent='…'; const chk=document.getElementById('selfCheck');
  const {iv,ct}=await encBytes(KEY,enc.encode(e.password));
  const token=bytesToHex(b64ToBytes(ct)), display=encodeToken(token,e.skin.rules);
  out.innerHTML=esc(display).split(SEP).join('<span class="sep">'+SEP+'</span>');
  try{ const back=decodeToken(display,e.skin.rules);
    chk.textContent = back===token?'✓ 可逆性自检通过（密文可完整还原）':'✗ 可逆性自检失败';
    chk.style.color = back===token?'var(--good)':'var(--bad)';
  }catch(err){ chk.textContent='✗ '+err.message; chk.style.color='var(--bad)'; }
  e._last={iv,ct,token,display};
}
function saveEntry(e,isNew){
  const name=document.getElementById('eName').value.trim();
  const pw=document.getElementById('ePw').value;
  e.name=name||'未命名'; e.account=document.getElementById('eAcc').value.trim();
  e.password=pw; e.category=document.getElementById('eCat').value.trim();
  e.notes=document.getElementById('eNotes').value.trim(); e.ts=Date.now();
  if(e.category && !VAULT.categories.includes(e.category)) VAULT.categories.push(e.category);
  if(isNew){ e.id=uuid(); VAULT.entries.push(e); }
  saveVault().then(()=>{ SEL=e.id; renderNav(); renderList(); renderDrawer(); toast('已保存','ok'); });
}
function delEntry(id){
  if(!confirm('确定删除该条目？此操作不可撤销。')) return;
  VAULT.entries=VAULT.entries.filter(x=>x.id!==id); SEL=null;
  saveVault().then(()=>{ renderNav(); renderList(); closeDrawer(); toast('已删除','warn'); });
}

/* ---------- 复制 + 剪贴板自动清空 ---------- */
async function copyText(text,label){
  const sec=(VAULT.settings&&VAULT.settings.clipboardClearSec)||0;
  try{
    await navigator.clipboard.writeText(text);
    if(sec>0){ toast('已复制'+label+'，'+sec+' 秒后自动清空剪贴板','ok');
      setTimeout(async()=>{ try{ await navigator.clipboard.writeText(''); toast('剪贴板已清空','warn'); }catch(e){} }, sec*1000);
    } else toast('已复制'+label,'ok');
  }catch(e){ toast('复制失败，请手动选择','err'); }
}

/* ---------- 钥匙卡生成 ---------- */
function generateKeycard(e){
  if(!e._last){ toast('密码为空','err'); return; }
  const kc={v:'cv1',salt:SALT,iters:ITERS,iv:e._last.iv,token:e._last.token,display:e._last.display,
    skin:{name:e.skin.name,rules:e.skin.rules.slice(),poems:POEMS,sep:SEP},title:e.name||'entry'};
  const blob=new Blob([buildKeycard(kc)],{type:'text/html;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='keycard_'+(e.name||'entry').replace(/[\\/:*?"<>|]/g,'_')+'.html';
  a.click(); URL.revokeObjectURL(a.href);
  toast('钥匙卡已导出','ok');
}
const KC_CSS=[
'body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 600px at 70% -10%,rgba(79,140,255,.14),transparent 60%),#0a0d14;color:#e8edf7;font-family:"Manrope","PingFang SC",sans-serif;padding:20px}',
'.card{width:min(520px,94vw);border:1px solid #212a3a;border-radius:16px;padding:30px;background:linear-gradient(180deg,#121826,#0c1018);box-shadow:0 30px 80px -40px #000}',
'.mark{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(150deg,#4f8cff,#2f66d6);font-family:"Sora",sans-serif;font-weight:700;font-size:18px;color:#fff}',
'h1{font-family:"Sora",sans-serif;font-weight:600;font-size:24px;margin:16px 0 4px}',
'.sub{color:#93a0b8;font-size:12px;letter-spacing:.1em;margin:0 0 22px}',
'label{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#5a6579;margin:16px 0 7px}',
'.cipher{font-family:"JetBrains Mono",monospace;font-size:13.5px;line-height:2;color:#cfe0ff;word-break:break-all;background:#0a0e16;border:1px solid #212a3a;border-radius:10px;padding:14px}',
'.meta{font-size:13px;color:#7db0ff}',
'input{width:100%;padding:12px;border-radius:9px;background:#0a0e16;border:1px solid #212a3a;color:#e8edf7;font-size:14px;box-sizing:border-box}',
'input:focus{outline:none;border-color:#4f8cff}',
'button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:9px;background:linear-gradient(180deg,#5b97ff,#3d78e6);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}',
'.out{margin-top:14px;font-family:"JetBrains Mono",monospace;font-size:15px;color:#35d07f;min-height:22px;word-break:break-all}',
'.out.err{color:#ff5f6d}',
'.note{font-size:11px;color:#5a6579;line-height:1.9;margin-top:20px;border-top:1px solid #212a3a;padding-top:14px}'
].join('');
const KC_JS=[
'var D=JSON.parse(document.getElementById("kcdata").textContent);',
'var POEMS=D.skin.poems, SEP=D.skin.sep||"\\u00b7", rules=D.skin.rules;',
'var XF={letter:{decode:function(s){return s.charCodeAt(0)-65;}},number:{decode:function(s){return parseInt(s,10)-10;}},poem:{decode:function(s){return POEMS.indexOf(s);}}};',
'function decodeToken(display){var segs=display.split(SEP),hex="";for(var i=0;i<segs.length;i++){var v=XF[rules[i%rules.length]].decode(segs[i]);if(v<0)throw new Error("第 "+(i+1)+" 段无法还原");hex+=v.toString(16);}return hex;}',
'function b64ToBytes(b){var s=atob(b),a=new Uint8Array(s.length);for(var i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}',
'function hexToBytes(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;}',
'async function deriveKey(pw){var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64ToBytes(D.salt),iterations:D.iters,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);}',
'async function run(){var out=document.getElementById("out");out.className="out";try{var hex=decodeToken(D.display);var key=await deriveKey(document.getElementById("pw").value);var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64ToBytes(D.iv)},key,hexToBytes(hex));out.textContent="密码： "+new TextDecoder().decode(pt);}catch(e){out.className="out err";out.textContent="还原失败：主密码错误，或密文已被改动";}}',
'document.getElementById("display").textContent=D.display;',
'document.getElementById("skin").textContent=D.skin.name;',
'document.getElementById("go").addEventListener("click",run);',
'document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")run();});'
].join('\n');
function buildKeycard(kc){
  const data=JSON.stringify(kc).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  return ['<!DOCTYPE html>','<html lang="zh-CN"><head><meta charset="utf-8">',
'<meta name="viewport" content="width=device-width,initial-scale=1.0"><title>钥匙卡 · '+esc(kc.title)+'</title>',
'<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&family=Manrope:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">',
'<style>'+KC_CSS+'</style></head><body><div class="card"><div class="mark">CV</div>',
'<h1>CipherVault 钥匙卡</h1><p class="sub">单文件 · 零依赖 · 可脱离原项目独立运行</p>',
'<label>趣味密文</label><div class="cipher" id="display"></div>',
'<label>皮肤</label><div class="meta" id="skin"></div>',
'<label>主密码</label><input id="pw" type="password" placeholder="输入主密码以还原密码">',
'<button id="go">还 原 密 码</button><div class="out" id="out"></div>',
'<p class="note">本卡片内部载荷仍是 AES-GCM 密文，需主密码才能解开；单独泄露并不等于泄露密码。趣味层只是「外衣」。</p>',
'</div><script id="kcdata" type="application/json">'+data+'<\/script><script>'+KC_JS+'<\/script></body></html>'].join('\n');
}

/* ---------- 设置 ---------- */
function openSettings(){
  document.getElementById('setIters').value=String(ITERS);
  document.getElementById('setAuto').value=String(VAULT.settings.autoLockMin);
  document.getElementById('setClip').value=String(VAULT.settings.clipboardClearSec);
  document.getElementById('settings').classList.remove('hidden');
}
async function applyIters(){
  const v=+document.getElementById('setIters').value;
  if(v===ITERS) return;
  const pw=prompt('修改密钥派生强度需重新输入主密码以重加密保险箱：');
  if(!pw){ document.getElementById('setIters').value=String(ITERS); return; }
  try{
    const nk=await deriveKey(pw,SALT,v); await decBytes(nk,readStore().iv,readStore().ct);
    KEY=nk; ITERS=v; await saveVault(); toast('已提升密钥派生强度','ok');
  }catch(e){ toast('主密码错误，未修改','err'); document.getElementById('setIters').value=String(ITERS); }
}
document.getElementById('setIters').onchange=applyIters;
document.getElementById('setAuto').onchange=()=>{ VAULT.settings.autoLockMin=+document.getElementById('setAuto').value; saveVault(); toast('已保存','ok'); };
document.getElementById('setClip').onchange=()=>{ VAULT.settings.clipboardClearSec=+document.getElementById('setClip').value; saveVault(); toast('已保存','ok'); };
document.getElementById('setClose').onclick=()=>document.getElementById('settings').classList.add('hidden');
document.getElementById('btnExport').onclick=()=>{
  const st=localStorage.getItem(STORE); if(!st){toast('暂无数据','err');return;}
  const blob=new Blob([st],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ciphervault_backup.json'; a.click(); URL.revokeObjectURL(a.href);
  toast('已导出备份','ok');
};
document.getElementById('btnImport').onclick=()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange=(ev)=>{
  const f=ev.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ const o=JSON.parse(r.result); if(!o.salt||!o.ct) throw 0; localStorage.setItem(STORE,JSON.stringify(o)); toast('已导入，请重新解锁','ok'); doLock(); }catch(e){ toast('文件格式不正确','err'); } };
  r.readAsText(f); ev.target.value='';
};

/* ---------- 自动锁定 ---------- */
['click','keydown','mousemove','touchstart'].forEach(ev=>window.addEventListener(ev,()=>{ lastAct=Date.now(); },{passive:true}));
setInterval(()=>{
  if(!VAULT) return; const m=VAULT.settings.autoLockMin; if(!m) return;
  if(Date.now()-lastAct > m*60000){ doLock(); toast('因长时间无操作已自动锁定','warn'); }
},20000);

/* ---------- 绑定 ---------- */
document.getElementById('btnCreate').onclick=doCreate;
document.getElementById('btnUnlock').onclick=doUnlock;
document.getElementById('btnReset').onclick=()=>{ if(confirm('将清空本地保险箱且不可恢复，确定？')){ localStorage.removeItem(STORE); boot(); } };
document.getElementById('pwInput').onkeydown=e=>{ if(e.key==='Enter') doUnlock(); };
document.getElementById('pwNew2').onkeydown=e=>{ if(e.key==='Enter') doCreate(); };
document.getElementById('btnNew').onclick=()=>{ SEL=null; renderDrawer(); };
document.getElementById('btnSettings').onclick=openSettings;
document.getElementById('btnLock').onclick=doLock;
document.getElementById('backdrop').onclick=closeDrawer;
document.getElementById('q').oninput=e=>{ Q=e.target.value.trim(); renderList(); };
document.getElementById('sort').onchange=e=>{ SORT=e.target.value; renderList(); };
document.getElementById('btnAddCat').onclick=()=>{ const c=prompt('新分类名称：'); if(c&&c.trim()){ VAULT.categories.push(c.trim()); saveVault().then(()=>{renderNav();toast('已新建分类','ok');}); } };

boot();
</script>
