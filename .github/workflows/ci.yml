name: CI

# 单机版：加密核心（Python）+ 前端（React）+ 桌面外壳（Electron）
# 目录未就绪时用 detect 跳过对应 job，避免骨架阶段红叉。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect components
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.d.outputs.core }}
      frontend: ${{ steps.d.outputs.frontend }}
      desktop: ${{ steps.d.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        name: 探测各组件是否已就绪
        run: |
          [ -f CipherVault-App/packages/ciphervault-core/pyproject.toml ] && echo "core=1" >> "$GITHUB_OUTPUT" || echo "core=0" >> "$GITHUB_OUTPUT"
          [ -f CipherVault-App/frontend/package.json ] && echo "frontend=1" >> "$GITHUB_OUTPUT" || echo "frontend=0" >> "$GITHUB_OUTPUT"
          [ -f CipherVault-App/desktop/package.json ] && echo "desktop=1" >> "$GITHUB_OUTPUT" || echo "desktop=0" >> "$GITHUB_OUTPUT"

  core:
    name: core (crypto lib)
    needs: detect
    if: needs.detect.outputs.core == '1'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CipherVault-App/packages/ciphervault-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -q

  frontend:
    name: frontend (React)
    needs: detect
    if: needs.detect.outputs.frontend == '1'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CipherVault-App/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: CipherVault-App/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build

  desktop:
    name: desktop (Electron shell)
    needs: detect
    if: needs.detect.outputs.desktop == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 语法检查
        run: |
          node --check CipherVault-App/desktop/main.cjs
          node --check CipherVault-App/desktop/preload.cjs
          node --check CipherVault-App/desktop/storage.cjs
      - name: 本地文件存储冒烟测试
        run: node CipherVault-App/desktop/smoke-test.cjs

  contracts:
    name: contracts (跨语言一致性)
    needs: detect
    if: needs.detect.outputs.core == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 校验跨语言测试向量能由核心库逐字节复现
        working-directory: CipherVault-App/packages/ciphervault-core
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m ciphervault_core.vectors --verify vectors.json
