[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ciphervault-backend"
version = "0.1.0"
description = "CipherVault 后端：账号注册/登录 + 零知识密文 blob 存取与乐观并发版本控制（FastAPI + SQLite + JWT）"
requires-python = ">=3.11"
# 运行时只需要 Web 框架、ORM、配置与 JWT。
# 严禁引入任何加解密库（cryptography / pycryptodome 等）——服务器不做解密，
# 见 docs/ARCHITECTURE.md 铁律 R3。哈希只用标准库 hashlib / hmac。
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.30,<0.31",
  "sqlalchemy>=2.0,<2.1",
  "pydantic>=2.9,<2.10",
  "pydantic-settings>=2.5",
  "pyjwt>=2.9,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27",
  "ruff>=0.6",
]

# 只打包 app/，不要把 tests/ 当成顶层包（flat-layout 自动发现会因多顶层目录报错）。
# 用 find+include 而不是写死 packages 列表，这样 docker/backend.Dockerfile 里
# 「先只 COPY pyproject.toml 再 pip install」的层缓存步骤在 app/ 尚未拷贝时也能构建成功。
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
